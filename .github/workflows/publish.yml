name: Publish

# Pushing a v* tag publishes that version to npm.
# Auth is npm trusted publishing (OIDC): no token is stored in this repository.
# The package's trusted publisher on npmjs.com must name this file (publish.yml).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Installs the pnpm version named by "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # A release build should not start from a restored cache.
          package-manager-cache: false

      - name: Check that the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      # The tag is checked out as a detached HEAD, so the branch checks do not apply.
      # A prerelease version (0.2.0-rc.1) goes to the "next" dist-tag, not "latest".
      - name: Publish
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          pnpm publish --access public --no-git-checks --tag "$tag"
